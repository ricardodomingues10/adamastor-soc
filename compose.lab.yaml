# Ambiente de laboratório: Portal SOC + VulnFlux + Greenbone + DefectDojo numa só stack.
#
#   ./scripts/lab.sh up        (gera o .env.lab na primeira vez e arranca tudo)
#
# Diferenças face à produção:
#   - Greenbone sempre ligado (sem gb-ctl/SSH): o socket do gvmd é partilhado diretamente
#   - DefectDojo local em http://localhost:8081, com o token da API obtido automaticamente
#   - VulnFlux em http://localhost:8080 sem HTTPS (VF_COOKIE_SECURE=false)
#   - Portal SOC em http://localhost:8090 (em produção corre noutra máquina: portal/compose.yaml)
#
# Redes (segmentadas por função; ver docs/infra e o mapa no README):
#   soc         integração: VulnFlux, portal, DefectDojo (nginx), Atalaia (web). Portas no host e saída.
#   dd          interna: entranhas do DefectDojo (BD, fila, workers)
#   gb          interna: entranhas do Greenbone (o VulnFlux usa o socket do gvmd, não a rede)
#   atalaia     interna: base de dados do Atalaia
#   servidores  interna: VulnFlux → servidores por SSH
#   sonda       interna: VulnFlux → sonda de descoberta (nmap)
#   alvos       interna: alvos de laboratório; só o scanner e a sonda lá chegam
#   saida       só saída (sem comunicação entre contentores): scanner, sonda, recolhas do Atalaia, apt
#
# Requer Docker Compose >= 2.24 (include, !override).

name: vulnflux-lab

x-vf-build: &vf-build
  context: .
  args:
    HTTP_PROXY: ${HTTP_PROXY:-}
    HTTPS_PROXY: ${HTTPS_PROXY:-}
    NO_PROXY: ${NO_PROXY:-}
    http_proxy: ${HTTP_PROXY:-}
    https_proxy: ${HTTPS_PROXY:-}
    no_proxy: ${NO_PROXY:-}

include:
  - path:
      - deploy/greenbone/compose.yaml
      - deploy/greenbone/compose.lab-redes.yaml
    env_file: .env.lab
  - path: deploy/defectdojo/compose.yaml
    env_file: .env.lab
  # Atalaia Cert: perfil "atalaia" (./scripts/lab.sh atalaia up)
  - path: deploy/atalaia/compose.yaml
    env_file: .env.lab

services:
  # Obtém o token da API do admin do DefectDojo e entrega-o ao VulnFlux
  dd-token:
    build: *vf-build
    image: vulnflux:lab
    user: "0:0"
    entrypoint: ["python", "-m", "vulnflux.labtools", "dd-token"]
    networks: [soc]
    environment:
      LAB_DD_URL: http://dd-nginx:8080
      LAB_DD_USER: admin
      LAB_DD_PASSWORD: ${DD_ADMIN_PASSWORD:?defina DD_ADMIN_PASSWORD no .env.lab}
      LAB_DD_TOKEN_FILE: /run/secrets/vf_dd_token
    volumes:
      - lab_secrets:/run/secrets
    depends_on:
      dd-nginx:
        condition: service_started

  vulnflux:
    build: *vf-build
    image: vulnflux:lab
    restart: unless-stopped
    env_file: .env.lab
    environment:
      VF_DATA_DIR: /data
      VF_PORT: "8080"  # porta dentro do container (a do host é a VF_PORT do .env.lab)
      VF_COOKIE_SECURE: "false"
      VF_DD_PUBLIC_URL: http://localhost:${DD_PORT:-8081}
      VF_DD_URL: http://dd-nginx:8080
      VF_DD_VERIFY_TLS: "false"
      VF_GREENBONE_ENABLED: "true"
      VF_GREENBONE_SOCKET: /run/gvmd/gvmd.sock
      VF_GREENBONE_USER: ${GB_ADMIN_USER:-orchestrator}
      VF_GREENBONE_PASSWORD: ${GB_ADMIN_PASSWORD:?defina GB_ADMIN_PASSWORD no .env.lab}
      VF_GREENBONE_SSH_HOST: ""
      VF_GREENBONE_PROFILE: ${VF_GREENBONE_PROFILE:-descoberta}
      VF_GREENBONE_DISCOVERY_URL: http://sonda:8000
      VF_GREENBONE_DISCOVERY_TOKEN: ${SONDA_TOKEN:?defina SONDA_TOKEN no .env.lab}
      http_proxy: ${HTTP_PROXY:-}
      https_proxy: ${HTTPS_PROXY:-}
      no_proxy: ${NO_PROXY:-}
    networks: [soc, servidores, sonda]
    ports:
      - "127.0.0.1:${VF_PORT:-8080}:8080"
    volumes:
      - lab_data:/data
      - gvmd_socket_vol:/run/gvmd
      - lab_secrets:/run/secrets:ro
    depends_on:
      dd-token:
        condition: service_completed_successfully
      gvmd:
        condition: service_started

  # Portal SOC: só fala com os outros por HTTP (como fará em produção, noutra máquina)
  portal:
    build:
      context: portal
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        http_proxy: ${HTTP_PROXY:-}
        https_proxy: ${HTTPS_PROXY:-}
        no_proxy: ${NO_PROXY:-}
    image: soc-portal:lab
    restart: unless-stopped
    env_file: .env.lab
    environment:
      SP_COOKIE_SECURE: "false"
      SP_CONFIG_FILE: /config/portal.yaml
      http_proxy: ${HTTP_PROXY:-}
      https_proxy: ${HTTPS_PROXY:-}
      no_proxy: ${NO_PROXY:-},vulnflux,dd-nginx,atalaia-web
    networks: [soc]
    ports:
      - "127.0.0.1:${PORTAL_PORT:-8090}:8080"
    volumes:
      - portal_data:/data
      - ./deploy/portal/portal.lab.yaml:/config/portal.yaml:ro
      - lab_secrets:/run/secrets:ro

  # Servidor de demonstração para a página Servidores (./scripts/lab.sh servers demo)
  lab-server:
    profiles: ["servers"]
    build: ./deploy/lab-server
    image: vulnflux-lab-server:lab
    hostname: lab-server
    networks: [servidores, saida]
    restart: unless-stopped
    volumes:
      - lab_server_keys:/keys

  # Sonda de descoberta (perfil "descoberta"): nmap a todas as portas TCP, do mesmo sítio da rede que
  # o scanner do Greenbone. Só o VulnFlux lhe fala (rede sonda); só NET_RAW, sistema de ficheiros só de leitura.
  sonda:
    build: ./deploy/sonda
    image: adamastor-sonda:lab
    restart: unless-stopped
    environment:
      SONDA_TOKEN: ${SONDA_TOKEN:?defina SONDA_TOKEN no .env.lab}
    networks: [sonda, alvos, saida]
    cap_drop: [ALL]
    cap_add: [NET_RAW]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]

  # Backups diários (BACKUP_HORA, guarda BACKUP_DIAS) para .lab/backups: bases de dados do DefectDojo
  # e do Atalaia (pg_dump) e os volumes de estado do VulnFlux e do portal. ./scripts/lab.sh backup
  backup:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    entrypoint: ["sh", "/backup.sh"]
    command: ["ciclo"]
    environment:
      TZ: Europe/Lisbon
      BACKUP_HORA: ${BACKUP_HORA:-02:30}
      BACKUP_DIAS: ${BACKUP_DIAS:-14}
      BACKUP_UID: ${BACKUP_UID:-1000}
      BACKUP_GID: ${BACKUP_GID:-1000}
      DD_DATABASE_PASSWORD: ${DD_DATABASE_PASSWORD:-defectdojo}
    networks: [dd, atalaia]
    volumes:
      - ./deploy/backup/backup.sh:/backup.sh:ro
      - ./.lab/backups:/backups
      - ${ATALAIA_SECRETS:-./.lab/atalaia/secrets}:/src/atalaia_secrets:ro
      - lab_data:/src/vulnflux:ro
      - portal_data:/src/portal:ro
      - lab_secrets:/src/lab_secrets:ro
      - lab_server_keys:/src/lab_server_keys:ro

  # Alvo de laboratório com vulnerabilidades críticas conhecidas (Metasploitable 2: vsftpd com backdoor,
  # UnrealIRCd com backdoor, distcc, Samba usermap, Java RMI…). Sem portas publicadas e só na rede
  # "alvos" (internal, sem saída): o único serviço do SOC que lhe chega é o ospd-openvas.
  # NUNCA expor fora do laboratório. ./scripts/lab.sh alvo scan
  alvo-vulneravel:
    profiles: ["alvos"]
    image: tleemcjr/metasploitable2:latest@sha256:e559450b37dccc1909eafa2df5b20bb052e1bd801246f4539a3ef183d5f7288a
    hostname: alvo-vulneravel
    command: ["sh", "-c", "/bin/services.sh && tail -f /dev/null"]
    networks: [alvos]
    tty: true
    restart: unless-stopped

networks:
  soc: {}
  dd:
    internal: true
  atalaia:
    internal: true
  servidores:
    internal: true
  sonda:
    internal: true
  alvos:
    internal: true
  saida:
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"

volumes:
  lab_server_keys:
  portal_data:
  lab_data:
  lab_secrets:
