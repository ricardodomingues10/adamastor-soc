# Ambiente de laboratório: Portal SOC + VulnFlux + Greenbone + DefectDojo numa só stack.
#
#   ./scripts/lab.sh up        (gera o .env.lab na primeira vez e arranca tudo)
#
# Diferenças face à produção:
#   - Greenbone sempre ligado (sem gb-ctl/SSH): o socket do gvmd é partilhado diretamente
#   - DefectDojo local em http://localhost:8081, com o token da API obtido automaticamente
#   - VulnFlux em http://localhost:8080 sem HTTPS (VF_COOKIE_SECURE=false)
#   - Portal SOC em http://localhost:8090 (em produção corre noutra máquina: portal/compose.yaml)
#
# Requer Docker Compose >= 2.20 (include).

name: vulnflux-lab

x-vf-build: &vf-build
  context: .
  args:
    HTTP_PROXY: ${HTTP_PROXY:-}
    HTTPS_PROXY: ${HTTPS_PROXY:-}
    NO_PROXY: ${NO_PROXY:-}
    http_proxy: ${HTTP_PROXY:-}
    https_proxy: ${HTTPS_PROXY:-}
    no_proxy: ${NO_PROXY:-}

include:
  - path:
      - deploy/greenbone/compose.yaml
      - deploy/greenbone/compose.lab-alvos.yaml
    env_file: .env.lab
  - path: deploy/defectdojo/compose.yaml
    env_file: .env.lab
  # Atalaia Cert: perfil "atalaia" (./scripts/lab.sh atalaia up)
  - path: deploy/atalaia/compose.yaml
    env_file: .env.lab

services:
  # Obtém o token da API do admin do DefectDojo e entrega-o ao VulnFlux
  dd-token:
    build: *vf-build
    image: vulnflux:lab
    user: "0:0"
    entrypoint: ["python", "-m", "vulnflux.labtools", "dd-token"]
    environment:
      LAB_DD_URL: http://dd-nginx:8080
      LAB_DD_USER: admin
      LAB_DD_PASSWORD: ${DD_ADMIN_PASSWORD:?defina DD_ADMIN_PASSWORD no .env.lab}
      LAB_DD_TOKEN_FILE: /run/secrets/vf_dd_token
    volumes:
      - lab_secrets:/run/secrets
    depends_on:
      dd-nginx:
        condition: service_started

  vulnflux:
    build: *vf-build
    image: vulnflux:lab
    restart: unless-stopped
    env_file: .env.lab
    environment:
      VF_DATA_DIR: /data
      VF_PORT: "8080"  # porta dentro do container (a do host é a VF_PORT do .env.lab)
      VF_COOKIE_SECURE: "false"
      VF_DD_PUBLIC_URL: http://localhost:${DD_PORT:-8081}
      VF_DD_URL: http://dd-nginx:8080
      VF_DD_VERIFY_TLS: "false"
      VF_GREENBONE_ENABLED: "true"
      VF_GREENBONE_SOCKET: /run/gvmd/gvmd.sock
      VF_GREENBONE_USER: ${GB_ADMIN_USER:-orchestrator}
      VF_GREENBONE_PASSWORD: ${GB_ADMIN_PASSWORD:?defina GB_ADMIN_PASSWORD no .env.lab}
      VF_GREENBONE_SSH_HOST: ""
      http_proxy: ${HTTP_PROXY:-}
      https_proxy: ${HTTPS_PROXY:-}
      no_proxy: ${NO_PROXY:-}
    ports:
      - "127.0.0.1:${VF_PORT:-8080}:8080"
    volumes:
      - lab_data:/data
      - gvmd_socket_vol:/run/gvmd
      - lab_secrets:/run/secrets:ro
    depends_on:
      dd-token:
        condition: service_completed_successfully
      gvmd:
        condition: service_started

  # Portal SOC: só fala com os outros por HTTP (como fará em produção, noutra máquina)
  portal:
    build:
      context: portal
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        http_proxy: ${HTTP_PROXY:-}
        https_proxy: ${HTTPS_PROXY:-}
        no_proxy: ${NO_PROXY:-}
    image: soc-portal:lab
    restart: unless-stopped
    env_file: .env.lab
    environment:
      SP_COOKIE_SECURE: "false"
      SP_CONFIG_FILE: /config/portal.yaml
      http_proxy: ${HTTP_PROXY:-}
      https_proxy: ${HTTPS_PROXY:-}
      no_proxy: ${NO_PROXY:-},vulnflux,dd-nginx
    ports:
      - "127.0.0.1:${PORTAL_PORT:-8090}:8080"
    volumes:
      - portal_data:/data
      - ./deploy/portal/portal.lab.yaml:/config/portal.yaml:ro
      - lab_secrets:/run/secrets:ro

  # Servidor de demonstração para a página Servidores (./scripts/lab.sh servers demo)
  lab-server:
    profiles: ["servers"]
    build: ./deploy/lab-server
    image: vulnflux-lab-server:lab
    hostname: lab-server
    restart: unless-stopped
    volumes:
      - lab_server_keys:/keys

  # Alvo de laboratório com vulnerabilidades críticas conhecidas (Metasploitable 2: vsftpd com backdoor,
  # UnrealIRCd com backdoor, distcc, Samba usermap, Java RMI…). Sem portas publicadas e só na rede
  # "alvos" (internal, sem saída): o único serviço do SOC que lhe chega é o ospd-openvas.
  # NUNCA expor fora do laboratório. ./scripts/lab.sh alvo scan
  alvo-vulneravel:
    profiles: ["alvos"]
    image: tleemcjr/metasploitable2:latest
    hostname: alvo-vulneravel
    command: ["sh", "-c", "/bin/services.sh && tail -f /dev/null"]
    networks: [alvos]
    tty: true
    restart: unless-stopped

volumes:
  lab_server_keys:
  portal_data:
  lab_data:
  lab_secrets:
