name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
      - name: Testes
        run: pytest
      - name: ShellCheck
        run: shellcheck deploy/greenbone/gb-ctl.sh
      - name: Validar compose
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.greenbone.yml config -q || true
          docker compose -f deploy/greenbone/compose.yaml config -q

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagem
        run: docker build -t vulnflux:ci .
      - name: Smoke test
        run: |
          docker run -d --name vf -e VF_ADMIN_PASSWORD=ci -e VF_COOKIE_SECURE=false -p 8080:8080 vulnflux:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/healthz
          docker exec vf wpscan --version --no-banner
          docker logs vf

  publish:
    # Publica a imagem no GHCR para servidores sem acesso direto aos repositórios
    # (apt/PyPI/RubyGems): no servidor basta `docker compose pull`.
    runs-on: ubuntu-latest
    needs: [test, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir e publicar
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}
          docker build \
            --label org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY} \
            --label org.opencontainers.image.revision=${GITHUB_SHA} \
            -t "$IMAGE:latest" -t "$IMAGE:sha-${GITHUB_SHA::7}" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:sha-${GITHUB_SHA::7}"
      - name: Exportar imagem (para servidores totalmente offline)
        run: docker save "ghcr.io/${GITHUB_REPOSITORY,,}:latest" | gzip > vulnflux-image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: vulnflux-image
          path: vulnflux-image.tar.gz
          retention-days: 14
