name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar
        run: |
          pip install -e ".[dev]"
          pip install -e "./portal[dev]"
      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
          cd portal && ruff check src tests && ruff format --check src tests
      - name: Testes (VulnFlux)
        run: pytest
      - name: Testes (Portal SOC)
        working-directory: portal
        run: pytest
      - name: ShellCheck
        run: shellcheck deploy/greenbone/gb-ctl.sh scripts/lab.sh scripts/ci_lab_smoke.sh scripts/ci_greenbone_lab.sh
      - name: Validar compose
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.greenbone.yml config -q || true
          docker compose -f deploy/greenbone/compose.yaml config -q
          cp lab.env.example .env.lab && sed -i 's/=GERAR/=ci-segredo/' .env.lab
          docker compose -f compose.lab.yaml --env-file .env.lab config -q
          docker compose -f compose.lab.yaml --env-file .env.lab --profile atalaia config -q
          docker compose -f compose.lab.yaml --env-file .env.lab --profile alvos --profile servers config -q
          cp portal/.env.example portal/.env && cp portal/portal.example.yaml portal/portal.yaml
          docker compose -f portal/compose.yaml config -q
          SP_CONFIG_FILE=portal/portal.yaml python -c "from socportal.registry import Registry; from pathlib import Path; r = Registry(Path('portal/portal.yaml')); assert not r.error, r.error"
          python -c "from socportal.registry import Registry; from pathlib import Path; r = Registry(Path('deploy/portal/portal.lab.yaml')); assert not r.error, r.error"

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Construir imagem
        run: docker build -t vulnflux:ci .
      - name: Smoke test
        run: |
          docker run -d --name vf -e VF_ADMIN_PASSWORD=ci -e VF_COOKIE_SECURE=false -p 8080:8080 vulnflux:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/healthz
          docker exec vf wpscan --version --no-banner
          docker logs vf
      - name: Imagem do Portal SOC
        run: |
          docker build -t soc-portal:ci portal
          cp portal/portal.example.yaml /tmp/portal.yaml
          docker run -d --name sp -e SP_ADMIN_PASSWORD=ci -e SP_COOKIE_SECURE=false \
            -v /tmp/portal.yaml:/config/portal.yaml:ro -p 8090:8080 soc-portal:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8090/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8090/healthz
          docker exec sp soc-portal check
          docker logs sp
      # Vulnerabilidades das nossas imagens (falha com CRITICAL que já tenha correção) e SBOM CycloneDX
      - name: Trivy e SBOM
        run: |
          mkdir -p sbom
          T=(docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/sbom:/out" -v trivy-cache:/root/.cache
             aquasec/trivy:0.61.0)
          fail=0
          for img in vulnflux:ci soc-portal:ci; do
            n=${img%%:*}
            "${T[@]}" image --quiet --format cyclonedx --output "/out/$n.cdx.json" "$img"
            "${T[@]}" image --quiet --scanners vuln --ignore-unfixed --format json --output "/out/$n.trivy.json" "$img"
            c=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' "sbom/$n.trivy.json")
            h=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' "sbom/$n.trivy.json")
            p=$(jq '[.components[]?] | length' "sbom/$n.cdx.json")
            echo "::notice title=trivy $n::$c críticas e $h altas com correção disponível · SBOM com $p componentes"
            [ "$c" -eq 0 ] || fail=1
          done
          exit $fail
      - name: Procurar segredos no repositório (Trivy)
        run: docker run --rm -v "$PWD:/src:ro" aquasec/trivy:0.61.0 fs --quiet --scanners secret --exit-code 1 /src
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sbom
          path: sbom/
          retention-days: 90

  publish:
    # Publica a imagem no GHCR para servidores sem acesso direto aos repositórios
    # (apt/PyPI/RubyGems): no servidor basta `docker compose pull`.
    runs-on: ubuntu-latest
    needs: [test, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Dois pushes seguidos não publicam ao mesmo tempo (o 2.º espera pelo 1.º)
    concurrency:
      group: publish-ghcr
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir e publicar
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/vulnflux
          docker build \
            --label org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY} \
            --label org.opencontainers.image.revision=${GITHUB_SHA} \
            -t "$IMAGE:latest" -t "$IMAGE:sha-${GITHUB_SHA::7}" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:sha-${GITHUB_SHA::7}"
      - name: Construir e publicar o Portal SOC
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/soc-portal
          docker build \
            --label org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY} \
            --label org.opencontainers.image.revision=${GITHUB_SHA} \
            -t "$IMAGE:latest" -t "$IMAGE:sha-${GITHUB_SHA::7}" portal
          docker push "$IMAGE:latest"
          docker push "$IMAGE:sha-${GITHUB_SHA::7}"
      - name: Exportar imagens (para servidores totalmente offline)
        run: |
          docker save "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/vulnflux:latest" | gzip > vulnflux-image.tar.gz
          docker save "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/soc-portal:latest" | gzip > soc-portal-image.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: vulnflux-image
          path: vulnflux-image.tar.gz
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: soc-portal-image
          path: soc-portal-image.tar.gz
          retention-days: 14

  lab-smoke:
    # DefectDojo real + VulnFlux do laboratório: token automático e reimport verdadeiro
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Laboratório (DefectDojo + VulnFlux)
        run: ./scripts/ci_lab_smoke.sh
      - name: Logs em caso de falha
        if: failure()
        run: |
          C="docker compose -f compose.lab.yaml --env-file .env.lab --profile servers"
          $C ps -a
          $C logs --no-color --tail=200 dd-initializer dd-uwsgi dd-nginx dd-token vulnflux portal lab-server
          # Também como anotações (legíveis pela API sem descarregar os logs)
          for svc in dd-initializer dd-uwsgi dd-nginx dd-token vulnflux portal lab-server; do
            msg=$($C logs --no-color --no-log-prefix --tail=25 "$svc" 2>&1 | cut -c1-220 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=$svc::$msg"
          done
