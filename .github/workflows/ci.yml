name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
      - name: Testes
        run: pytest
      - name: ShellCheck
        run: shellcheck deploy/greenbone/gb-ctl.sh
      - name: Validar compose
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config -q
          docker compose -f deploy/greenbone/compose.yaml config -q

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagem
        run: docker build -t vulnflux:ci .
      - name: Smoke test
        run: |
          docker run -d --name vf -e VF_ADMIN_PASSWORD=ci -e VF_COOKIE_SECURE=false -p 8080:8080 vulnflux:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/healthz
          docker exec vf wpscan --version --no-banner
          docker logs vf
