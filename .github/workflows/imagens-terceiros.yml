# Semanal: vulnerabilidades das imagens de terceiros fixadas no compose (DefectDojo, Greenbone,
# PostgreSQL…). Só informa (anotações e relatório); quem decide atualizar é o PR do Dependabot.
name: imagens-terceiros
on:
  schedule:
    - cron: "37 5 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Analisar
        run: |
          mkdir -p out
          imgs=$(grep -rhoE 'image: [^ ]+@sha256:[0-9a-f]{64}' compose.lab.yaml deploy/*/compose.yaml | awk '{print $2}' | sort -u)
          for img in $imgs; do
            n=$(echo "${img%%@*}" | tr '/:' '__')
            docker run --rm -v "$PWD/out:/out" -v trivy-cache:/root/.cache aquasec/trivy:0.61.0 image --quiet \
              --scanners vuln --ignore-unfixed --format json --output "/out/$n.json" "$img" || { echo "::warning title=$n::falhou"; continue; }
            c=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' "out/$n.json")
            h=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' "out/$n.json")
            echo "$c críticas · $h altas · ${img%%@*}" | tee -a out/resumo.txt
          done
          sort -rn out/resumo.txt | head -9 | while read -r l; do echo "::notice title=imagens-terceiros::$l"; done
      - uses: actions/upload-artifact@v4
        with:
          name: trivy-terceiros
          path: out/
          retention-days: 30
