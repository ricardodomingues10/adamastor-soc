# Atualizações automáticas das dependências (pull requests semanais, testadas pelo CI antes de entrarem).
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule: {interval: weekly, day: monday, time: "06:00", timezone: Europe/Lisbon}
    groups:
      python: {patterns: ["*"], update-types: [minor, patch]}
  - package-ecosystem: pip
    directory: "/portal"
    schedule: {interval: weekly, day: monday, time: "06:00", timezone: Europe/Lisbon}
    groups:
      python: {patterns: ["*"], update-types: [minor, patch]}
  - package-ecosystem: docker
    directories: ["/", "/portal", "/deploy/lab-server"]
    schedule: {interval: weekly, day: monday, time: "06:00", timezone: Europe/Lisbon}
  - package-ecosystem: docker-compose
    directories: ["/", "/deploy/greenbone", "/deploy/atalaia", "/portal"]
    schedule: {interval: weekly, day: monday, time: "06:00", timezone: Europe/Lisbon}
    ignore:
      # Uma versão major do PostgreSQL não lê os dados da anterior: migra-se à mão (pg_dump/pg_upgrade)
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule: {interval: weekly, day: monday, time: "06:00", timezone: Europe/Lisbon}
    groups:
      actions: {patterns: ["*"]}
