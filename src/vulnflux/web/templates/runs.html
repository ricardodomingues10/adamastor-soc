{% extends "base.html" %}
{% from "macros.html" import icon %}
{% block title %}Execuções{% endblock %}
{% block heading %}<h1>Execuções</h1><p class="muted">{{ total }} execução(ões) com os filtros atuais</p>{% endblock %}
{% block content %}
<section class="card">
  <form class="filters" method="get" action="/runs" hx-get="/runs" hx-target="#runs-table" hx-trigger="change" hx-push-url="true">
    <label class="field compact"><span>Fonte</span>
      <select name="source">
        <option value="">Todas</option>
        {% for s in Source %}<option value="{{ s.value }}" {{ 'selected' if f.source == s.value }}>{{ s.label }}</option>{% endfor %}
      </select>
    </label>
    <label class="field compact"><span>Estado</span>
      <select name="status">
        <option value="">Todos</option>
        {% for s in RunStatus %}<option value="{{ s.value }}" {{ 'selected' if f.status == s.value }}>{{ s.label }}</option>{% endfor %}
      </select>
    </label>
    <label class="field compact"><span>Tipo de erro</span>
      <select name="kind">
        <option value="">Todos</option>
        {% for k in ErrorKind %}<option value="{{ k.value }}" {{ 'selected' if f.kind == k.value }}>{{ k.label }}</option>{% endfor %}
      </select>
    </label>
    <label class="field compact"><span>Host</span>
      <select name="host">
        <option value="">Todos</option>
        {% for h in hosts %}<option value="{{ h.id }}" {{ 'selected' if f.host == h.id }}>{{ h.name }}</option>{% endfor %}
      </select>
    </label>
    <noscript><button class="btn">Filtrar</button></noscript>
    <a class="btn btn-ghost btn-sm" href="/runs">Limpar</a>
  </form>
  <div id="runs-table">
    {% include "partials/runs_table.html" %}
  </div>
</section>
{% endblock %}
