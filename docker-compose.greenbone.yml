# Override para quando o Greenbone corre na mesma máquina (recomendado).
#
# Pré-requisitos (ver deploy/greenbone/README.md):
#   - stack do Greenbone em /opt/greenbone, iniciada pelo menos uma vez (cria o volume gb_gvmd_socket)
#   - utilizador gbctl com forced command para o gb-ctl.sh
#   - ./secrets/gbctl_key        chave privada SSH (chown 10001:10001, chmod 600)
#   - ./secrets/known_hosts      ssh-keyscan do host (chown 10001:10001)

services:
  vulnflux:
    environment:
      VF_GREENBONE_ENABLED: "true"
      VF_GREENBONE_SOCKET: /run/gvmd/gvmd.sock
      # O container chega ao sshd do host por host.docker.internal
      VF_GREENBONE_SSH_HOST: host.docker.internal
      VF_GREENBONE_SSH_KEY: /run/secrets/vf_gbctl_key
      VF_GREENBONE_SSH_KNOWN_HOSTS: /run/secrets/vf_gbctl_known_hosts
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - gb_gvmd_socket:/run/gvmd
    secrets:
      - vf_gbctl_key
      - vf_gbctl_known_hosts

volumes:
  gb_gvmd_socket:
    external: true

secrets:
  vf_gbctl_key:
    file: ./secrets/gbctl_key
  vf_gbctl_known_hosts:
    file: ./secrets/known_hosts
