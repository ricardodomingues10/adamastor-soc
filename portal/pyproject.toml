[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "soc-portal"
version = "0.1.0"
description = "Portal SOC: estado, ligações, versões e frescura dos dados de todos os serviços"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.2,<3",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "requests>=2.32,<3",
  "pyyaml>=6,<7",
  "packaging>=24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "responses>=0.25", "ruff>=0.5"]

[project.scripts]
soc-portal = "socportal.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
socportal = ["web/templates/*.html", "web/templates/**/*.html", "web/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "E501"]

[tool.ruff.format]
quote-style = "double"
