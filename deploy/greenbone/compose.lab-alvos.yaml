# Só no laboratório (incluído por compose.lab.yaml): liga o scanner à rede isolada dos alvos.
# "alvos" é internal: sem saída para fora nem para o resto do laboratório. Dos serviços do SOC,
# só o ospd-openvas (onde corre o openvas que gera o tráfego do scan) lá chega.
services:
  ospd-openvas:
    networks:
      default: {}
      alvos: {}

networks:
  alvos:
    internal: true
