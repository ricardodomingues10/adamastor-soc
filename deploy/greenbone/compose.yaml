# Greenbone Community Edition — stack mínima para o scan orchestrator
#
# Derivada do compose oficial (feed release 24.10). Diferenças:
#   - SEM interface web: removidos gsa, gsad, gvm-config, nginx (sem portas expostas)
#   - SEM gvm-tools / gvm-cli: o orchestrator fala GMP com python-gvm
#   - SEM o container "openvas" (era só um `tail -f` do log)
#   - Socket do gvmd num volume com nome fixo (gb_gvmd_socket) para o orchestrator montar
#   - Limites de concorrência e memória no ospd-openvas (lição do deadlock OOM)
#   - Tag das imagens core parametrizável (GB_TAG) para fixar versões validadas
#
# Ciclo de vida: controlado por /opt/greenbone/gb-ctl.sh (start|stop|update|status).
# Os volumes são persistentes; os containers são descartáveis.

# Mesmo nome de projeto que o compose oficial: reutiliza os volumes existentes (feeds,
# BD do gvmd) em vez de começar do zero. Confirmar com: docker volume ls | grep gvmd_data_vol
name: greenbone-community-edition

x-core-restart: &core-restart
  deploy:
    restart_policy:
      condition: on-failure

services:
  # ---------------------------------------------------------------------------
  # Feeds (copiam dados para os volumes ao arrancar; atualizam-se com `pull`)
  # ---------------------------------------------------------------------------
  vulnerability-tests:
    image: registry.community.greenbone.net/community/vulnerability-tests
    environment:
      FEED_RELEASE: "24.10"
      KEEP_ALIVE: 1
    volumes:
      - vt_data_vol:/mnt

  notus-data:
    image: registry.community.greenbone.net/community/notus-data
    environment:
      KEEP_ALIVE: 1
    volumes:
      - notus_data_vol:/mnt

  scap-data:
    image: registry.community.greenbone.net/community/scap-data
    environment:
      KEEP_ALIVE: 1
    volumes:
      - scap_data_vol:/mnt

  cert-bund-data:
    image: registry.community.greenbone.net/community/cert-bund-data
    environment:
      KEEP_ALIVE: 1
    volumes:
      - cert_data_vol:/mnt

  dfn-cert-data:
    image: registry.community.greenbone.net/community/dfn-cert-data
    environment:
      KEEP_ALIVE: 1
    volumes:
      - cert_data_vol:/mnt
    depends_on:
      cert-bund-data:
        condition: service_healthy

  data-objects:
    image: registry.community.greenbone.net/community/data-objects
    environment:
      FEED_RELEASE: "24.10"
      KEEP_ALIVE: 1
    volumes:
      - data_objects_vol:/mnt

  report-formats:
    image: registry.community.greenbone.net/community/report-formats
    environment:
      FEED_RELEASE: "24.10"
      KEEP_ALIVE: 1
    volumes:
      - data_objects_vol:/mnt
    depends_on:
      data-objects:
        condition: service_healthy

  gpg-data:
    image: registry.community.greenbone.net/community/gpg-data
    volumes:
      - gpg_data_vol:/mnt

  # ---------------------------------------------------------------------------
  # Base de dados e cache
  # ---------------------------------------------------------------------------
  redis-server:
    image: registry.community.greenbone.net/community/redis-server
    <<: *core-restart
    volumes:
      - redis_socket_vol:/run/redis/

  pg-gvm-migrator:
    image: registry.community.greenbone.net/community/pg-gvm-migrator:${GB_TAG:-stable}
    deploy:
      restart_policy:
        condition: none
    volumes:
      - psql_data_vol:/var/lib/postgresql
      - psql_socket_vol:/var/run/postgresql

  pg-gvm:
    image: registry.community.greenbone.net/community/pg-gvm:${GB_TAG:-stable}
    <<: *core-restart
    volumes:
      - psql_data_vol:/var/lib/postgresql
      - psql_socket_vol:/var/run/postgresql
    depends_on:
      pg-gvm-migrator:
        condition: service_completed_successfully

  # ---------------------------------------------------------------------------
  # Manager (GMP) — único ponto de contacto do orchestrator
  # ---------------------------------------------------------------------------
  gvmd:
    image: registry.community.greenbone.net/community/gvmd:${GB_TAG:-stable}
    <<: *core-restart
    environment:
      # O arranque da imagem cria este utilizador (se não existir) e define-o como
      # feed import owner. A omissão admin/admin é o comportamento da imagem oficial.
      USER: ${GB_ADMIN_USER:-admin}
      PASSWORD: ${GB_ADMIN_PASSWORD:-admin}
    volumes:
      - gvmd_data_vol:/var/lib/gvm
      - scap_data_vol:/var/lib/gvm/scap-data/
      - cert_data_vol:/var/lib/gvm/cert-data
      - data_objects_vol:/var/lib/gvm/data-objects/gvmd
      - vt_data_vol:/var/lib/openvas/plugins
      - psql_data_vol:/var/lib/postgresql
      - gvmd_socket_vol:/run/gvmd
      - ospd_openvas_socket_vol:/run/ospd
      - psql_socket_vol:/var/run/postgresql
    depends_on:
      pg-gvm:
        condition: service_started
      scap-data:
        condition: service_healthy
      cert-bund-data:
        condition: service_healthy
      dfn-cert-data:
        condition: service_healthy
      data-objects:
        condition: service_healthy
      report-formats:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Scanner
  # ---------------------------------------------------------------------------
  configure-openvas:
    image: registry.community.greenbone.net/community/openvas-scanner:${GB_TAG:-stable}
    volumes:
      - openvas_data_vol:/mnt
      - openvas_log_data_vol:/var/log/openvas
    command:
      - /bin/sh
      - -c
      - |
        printf "table_driven_lsc = yes\nopenvasd_server = http://openvasd:80\n" > /mnt/openvas.conf
        sed "s/127/128/" /etc/openvas/openvas_log.conf | sed 's/gvm/openvas/' > /mnt/openvas_log.conf
        chmod 644 /mnt/openvas.conf
        chmod 644 /mnt/openvas_log.conf
        touch /var/log/openvas/openvas.log
        chmod 666 /var/log/openvas/openvas.log

  openvasd:
    image: registry.community.greenbone.net/community/openvas-scanner:${GB_TAG:-stable}
    <<: *core-restart
    environment:
      OPENVASD_MODE: service_notus
      GNUPGHOME: /etc/openvas/gnupg
      LISTENING: 0.0.0.0:80
    volumes:
      - openvas_data_vol:/etc/openvas
      - openvas_log_data_vol:/var/log/openvas
      - gpg_data_vol:/etc/openvas/gnupg
      - notus_data_vol:/var/lib/notus
    depends_on:
      vulnerability-tests:
        condition: service_healthy
      notus-data:
        condition: service_healthy
      configure-openvas:
        condition: service_completed_successfully
      gpg-data:
        condition: service_completed_successfully
    networks:
      default:
        aliases:
          - openvasd

  ospd-openvas:
    image: registry.community.greenbone.net/community/ospd-openvas:${GB_TAG:-stable}
    <<: *core-restart
    hostname: ospd-openvas.local
    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    command:
      [
        "ospd-openvas",
        "-f",
        "--config",
        "/etc/gvm/ospd-openvas.conf",
        "--notus-feed-dir",
        "/var/lib/notus/advisories",
        "-m",
        "666",
        # Defesa em profundidade: o orchestrator já limita a concorrência,
        # mas o scanner recusa-se a passar destes limites mesmo que algo falhe.
        "--max-scans",
        "${GB_MAX_SCANS:-3}",
        "--min-free-mem-scan-queue",
        "${GB_MIN_FREE_MEM_MB:-2048}",
      ]
    volumes:
      - gpg_data_vol:/etc/openvas/gnupg
      - vt_data_vol:/var/lib/openvas/plugins
      - notus_data_vol:/var/lib/notus
      - ospd_openvas_socket_vol:/run/ospd
      - redis_socket_vol:/run/redis/
      - openvas_data_vol:/etc/openvas/
      - openvas_log_data_vol:/var/log/openvas
    depends_on:
      redis-server:
        condition: service_started
      gpg-data:
        condition: service_completed_successfully
      configure-openvas:
        condition: service_completed_successfully
      vulnerability-tests:
        condition: service_healthy
      notus-data:
        condition: service_healthy

volumes:
  gpg_data_vol:
  scap_data_vol:
  cert_data_vol:
  data_objects_vol:
  gvmd_data_vol:
  psql_data_vol:
  vt_data_vol:
  notus_data_vol:
  psql_socket_vol:
  gvmd_socket_vol:
    name: gb_gvmd_socket   # nome fixo: o compose do orchestrator monta-o como external
  ospd_openvas_socket_vol:
  redis_socket_vol:
  openvas_data_vol:
  openvas_log_data_vol:
