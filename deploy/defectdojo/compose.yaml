# DefectDojo para o ambiente de laboratório.
#
# Adaptado do docker-compose.yml oficial (django-DefectDojo, master):
#   - serviços com prefixo dd- (não colidem com os do Greenbone)
#   - imagens do Docker Hub (versão e digest fixados) em vez de construir a partir do código
#   - sem o bind mount de docker/extra_settings
#   - password do admin definida por variável (em vez de gerada nos logs)
#   - UI publicada só em 127.0.0.1:${DD_PORT:-8081}
#   - redes segmentadas: só o dd-nginx sai da rede interna dd
#
# NÃO é para produção: o DefectDojo de produção é o que já existe.

x-dd-env: &dd-env
  DD_DATABASE_HOST: dd-postgres
  DD_DATABASE_PORT: "5432"
  DD_DATABASE_URL: postgresql://defectdojo:${DD_DATABASE_PASSWORD:-defectdojo}@dd-postgres:5432/defectdojo
  DD_CELERY_BROKER_URL: redis://dd-valkey:6379/0
  DD_CACHE_URL: redis://dd-valkey:6379/1
  DD_SECRET_KEY: ${DD_SECRET_KEY:?defina DD_SECRET_KEY no .env.lab}
  DD_CREDENTIAL_AES_256_KEY: ${DD_CREDENTIAL_AES_256_KEY:?defina DD_CREDENTIAL_AES_256_KEY no .env.lab}
  DD_DATABASE_READINESS_TIMEOUT: "60"

x-dd-image: &dd-image docker.io/defectdojo/defectdojo-django:3.4.304@sha256:6c767c6faab7bdf5df56fffe7ff8f140174c8104130c52a6ae63d74b11eefc8e

services:
  dd-nginx:
    networks: [soc, dd]
    image: docker.io/defectdojo/defectdojo-nginx:3.4.304@sha256:7d7f663b2f0d209fd7abdd6b595fe981d96d46b6f15feceae4020fb826b350c5
    restart: unless-stopped
    depends_on:
      dd-uwsgi:
        condition: service_started
    environment:
      NGINX_METRICS_ENABLED: "false"
      DD_UWSGI_HOST: dd-uwsgi
      DD_UWSGI_PORT: "3031"
    volumes:
      - dd_media:/usr/share/nginx/html/media
    ports:
      - "127.0.0.1:${DD_PORT:-8081}:8080"

  dd-uwsgi:
    networks: [dd]
    image: *dd-image
    restart: unless-stopped
    depends_on:
      dd-initializer:
        condition: service_completed_successfully
      dd-postgres:
        condition: service_started
      dd-valkey:
        condition: service_started
    entrypoint: ["/wait-for-it.sh", "dd-postgres:5432", "-t", "60", "--", "/entrypoint-uwsgi.sh"]
    environment:
      <<: *dd-env
      DD_DEBUG: "False"
      DD_ALLOWED_HOSTS: "*"
      DD_CSRF_TRUSTED_ORIGINS: http://localhost:${DD_PORT:-8081},http://127.0.0.1:${DD_PORT:-8081}
    volumes:
      - dd_media:/app/media

  dd-celerybeat:
    networks: [dd]
    image: *dd-image
    restart: unless-stopped
    depends_on:
      dd-initializer:
        condition: service_completed_successfully
    entrypoint: ["/wait-for-it.sh", "dd-postgres:5432", "-t", "60", "--", "/entrypoint-celery-beat.sh"]
    environment:
      <<: *dd-env

  dd-celeryworker:
    networks: [dd]
    image: *dd-image
    restart: unless-stopped
    depends_on:
      dd-initializer:
        condition: service_completed_successfully
    entrypoint: ["/wait-for-it.sh", "dd-postgres:5432", "-t", "60", "--", "/entrypoint-celery-worker.sh"]
    environment:
      <<: *dd-env
    volumes:
      - dd_media:/app/media

  dd-initializer:
    networks: [dd]
    image: *dd-image
    depends_on:
      dd-postgres:
        condition: service_started
    # Depois da inicialização oficial, força a password do admin para a do .env.lab.
    # O initializer oficial só cria o admin na primeira vez: sem isto, mudar a password no
    # .env.lab depois do 1.º arranque não tinha efeito (login falhava e o dd-token esperava).
    # Nota: não usar /wait-for-it.sh aqui — só executa o 1.º argumento depois de "--".
    # O próprio entrypoint-initializer.sh já espera pela base de dados.
    entrypoint:
      - bash
      - -c
      - |
        set -e
        /entrypoint-initializer.sh
        python manage.py shell -c "
        import os
        from django.contrib.auth import get_user_model
        u = get_user_model().objects.filter(username=os.environ['DD_ADMIN_USER']).first()
        if u:
            u.set_password(os.environ['DD_ADMIN_PASSWORD'])
            u.is_active = True
            u.save()
            print('password do admin sincronizada com o .env.lab')
        else:
            raise SystemExit('admin não encontrado depois da inicialização')
        "
    environment:
      <<: *dd-env
      DD_ADMIN_USER: admin
      DD_ADMIN_MAIL: admin@vulnflux.local
      DD_ADMIN_PASSWORD: ${DD_ADMIN_PASSWORD:?defina DD_ADMIN_PASSWORD no .env.lab}
      DD_ADMIN_FIRST_NAME: Admin
      DD_ADMIN_LAST_NAME: Lab
      DD_INITIALIZE: "true"

  dd-postgres:
    networks: [dd]
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    restart: unless-stopped
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: defectdojo
      POSTGRES_USER: defectdojo
      POSTGRES_PASSWORD: ${DD_DATABASE_PASSWORD:-defectdojo}
    volumes:
      - dd_postgres:/var/lib/postgresql/data

  dd-valkey:
    networks: [dd]
    image: valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    restart: unless-stopped
    volumes:
      - dd_valkey:/data

# dd: rede interna do DefectDojo (base de dados, fila, workers). Só o dd-nginx está também na
# rede soc, onde o VulnFlux, o portal e o browser lhe chegam.
networks:
  soc: {}
  dd:
    internal: true

volumes:
  dd_postgres:
  dd_media:
  dd_valkey:
