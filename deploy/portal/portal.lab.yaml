# Portal SOC no laboratório (compose.lab.yaml). Os URLs de verificação são os nomes
# dos containers; os links são os que abres no browser do Windows/WSL.

title: Adamastor SOC · Laboratório

services:
  - id: vulnflux
    name: VulnFlux
    group: Gestão de vulnerabilidades
    description: Scans WPScan e Greenbone, prioridades por risco e importação para o DefectDojo
    link: http://localhost:${VF_PORT:-8080}
    location: lab (WSL)
    probes:
      - type: soc-status
        name: Estado do VulnFlux
        url: http://vulnflux:8080/api/status
        token_env: VF_STATUS_TOKEN
    latest:
      github: ricardodomingues10/adamastor-soc
    depends_on: [defectdojo, greenbone]
    links:
      - {to: "defectdojo", via: "API REST v2", what: "importa findings, escreve prioridades P1–P4 e prazos"}
      - {to: "greenbone", via: "GMP (socket Unix)", what: "cria tasks, lança scans, lê reports e o estado dos feeds"}
      - {to: "WPScan API", via: "HTTPS", what: "base de dados de vulnerabilidades do WordPress"}
      - {to: "Sites WordPress", via: "HTTPS", what: "scans WPScan"}
      - {to: "Feeds KEV · EPSS · exploits", via: "HTTPS (diário)", what: "sinais para a prioridade"}

  - id: greenbone
    name: Greenbone
    group: Gestão de vulnerabilidades
    description: Scanner de rede (sem interface web no laboratório); feeds NVT, SCAP e CERT
    location: lab (WSL)
    probes:
      - type: soc-component
        name: Via VulnFlux (GMP)
        service: vulnflux
        component: greenbone
    links:
      - {to: "Alvos de rede", via: "varrimento de rede", what: "portas, serviços e vulnerabilidades"}

  - id: defectdojo
    name: DefectDojo
    group: Gestão de vulnerabilidades
    description: Findings, prioridades e SLA de correção
    link: http://localhost:${DD_PORT:-8081}
    location: lab (WSL)
    links:
      - {to: "PostgreSQL do DefectDojo", via: "base de dados", what: "findings, produtos, SLA"}
    probes:
      - type: defectdojo
        name: API v2
        url: http://dd-nginx:8080
        token_file: /run/secrets/vf_dd_token
    latest:
      github: DefectDojo/django-DefectDojo

  # ./scripts/lab.sh atalaia up  (enquanto não estiver ligado, aparece em baixo)
  - id: atalaia-cert
    name: Atalaia Cert
    group: Superfície externa e certificados
    function: surface
    template: atalaia-cert
    description: Certificados da CMDB vs. os servidos, CT na internet, renovações e pedidos SMAX
    link: http://localhost:${ATALAIA_PORT:-8088}
    api_url: http://atalaia-web:8088
    location: lab (WSL)
    links:
      - {to: "CMDB do cliente", via: "REST · SQL · ficheiro", what: "certificados registados (UCMDB por omissão)"}
      - {to: "Sistema de tickets", via: "API REST", what: "pedidos de renovação (SMAX por omissão)"}
      - {to: "Certificate Transparency", via: "HTTPS", what: "certificados emitidos na Internet"}
      - {to: "Sites e servidores TLS", via: "TLS (porta 443…)", what: "certificado realmente servido"}
    probes:
      - type: soc-status
        name: Estado do Atalaia
        url: /api/status
        token_env: ATALAIA_STATUS_TOKEN
    latest:
      github: ricardodomingues10/certs-watch

  # Servidores verificados pelo VulnFlux por SSH (saúde, hardening, atualizações por anéis)
  - id: servidores
    name: Servidores
    group: Infraestrutura
    function: assets
    description: Saúde, hardening e atualizações dos servidores ligados (sem agente, por SSH)
    link: http://localhost:${VF_PORT:-8080}/servers
    location: lab (WSL)
    probes:
      - type: soc-component
        name: Via VulnFlux (SSH)
        service: vulnflux
        component: servers
    depends_on: [vulnflux]
    links:
      - {to: "Servidores Linux", via: "SSH (sem agente)", what: "saúde, hardening, atualizações por anéis"}
